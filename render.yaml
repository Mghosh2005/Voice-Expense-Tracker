services:
  - type: web
    name: voice-expense-tracker
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn voice_tracker.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: voice-expense-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "voice-expense-tracker.onrender.com"
      - key: TIME_ZONE
        value: "Asia/Kolkata"

databases:
  - name: voice-expense-db
    plan: free
